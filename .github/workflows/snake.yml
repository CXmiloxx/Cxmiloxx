name: Generate Snake Animation 🐍

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3

      - name: Generar animación de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: CXmiloxx
          outputs: |
            ./output/snake.svg
            ./output/snake-dark.svg?palette=github-dark&color_snake=#FF5A1F&color_dots=#161616,#4A1D0F,#8A2F12,#C9431A,#FF5A1F
            ./output/snake-light.svg?color_snake=#E8461A&color_dots=#EBE7DE,#FFD9C7,#FFA580,#FF7A47,#E8461A

      - name: Subir snake.svg al repositorio
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: 'Generar animación de Snake 🐍'
          add: 'output/*.svg'
          pull: '--rebase --autostash'
